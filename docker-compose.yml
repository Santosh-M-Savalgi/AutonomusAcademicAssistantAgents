name: aaa-v3

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [mock, cpu, gpu]
    environment:
      POSTGRES_DB: aaa
      POSTGRES_USER: aaa
      POSTGRES_PASSWORD: aaa
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaa -d aaa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [mock, cpu, gpu]
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z@sha256:8793e960474071520bdb91bb9a6d1793eb229fdbc9dcb7ec75ad836b69bbab40
    profiles: [mock, cpu, gpu]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: aaa-minio
      MINIO_ROOT_PASSWORD: aaa-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio_probe:
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    profiles: [mock, cpu, gpu]
    entrypoint: ["/bin/sleep"]
    command: ["infinity"]
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://minio:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    image: aaa-v3-api
    build: &application_build
      context: .
      dockerfile: infra/docker/api.Dockerfile
    profiles: [mock, cpu, gpu]
    environment:
      APP_ENV: development
      AAA_PROFILE: ${AAA_PROFILE:-mock}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-auto}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:8080}
      MODEL_ID: ${MODEL_ID:-meta-llama/Llama-3.2-3B-Instruct}
      MODEL_ARTIFACT_PATH: ${MODEL_ARTIFACT_PATH:-models/llama-3.2-3b-instruct-q4_k_m.gguf}
      MODEL_LOCK_PATH: ${MODEL_LOCK_PATH:-models/MODELS.lock}
      LLAMA_CPP_VERSION: ${LLAMA_CPP_VERSION:-v0.6.0}
      MODEL_GATEWAY_RETRY_MAX_ATTEMPTS: ${MODEL_GATEWAY_RETRY_MAX_ATTEMPTS:-2}
      MODEL_GATEWAY_RETRY_BASE_DELAY_SECONDS: ${MODEL_GATEWAY_RETRY_BASE_DELAY_SECONDS:-0.05}
      MODEL_GATEWAY_RETRY_MAX_DELAY_SECONDS: ${MODEL_GATEWAY_RETRY_MAX_DELAY_SECONDS:-1.0}
      MODEL_GATEWAY_RETRY_JITTER_SECONDS: ${MODEL_GATEWAY_RETRY_JITTER_SECONDS:-0.05}
      MODEL_GATEWAY_INTERACTIVE_CAPACITY: ${MODEL_GATEWAY_INTERACTIVE_CAPACITY:-4}
      MODEL_GATEWAY_PREFETCH_CAPACITY: ${MODEL_GATEWAY_PREFETCH_CAPACITY:-2}
      MODEL_GATEWAY_BATCH_CAPACITY: ${MODEL_GATEWAY_BATCH_CAPACITY:-1}
      MODEL_GATEWAY_TIMEOUT_SECONDS: ${MODEL_GATEWAY_TIMEOUT_SECONDS:-30.0}
      MODEL_GATEWAY_CIRCUIT_FAILURE_THRESHOLD: ${MODEL_GATEWAY_CIRCUIT_FAILURE_THRESHOLD:-3}
      MODEL_GATEWAY_CIRCUIT_OPEN_DURATION_SECONDS: ${MODEL_GATEWAY_CIRCUIT_OPEN_DURATION_SECONDS:-30.0}
      MODEL_GATEWAY_CIRCUIT_HALF_OPEN_PROBE_CAPACITY: ${MODEL_GATEWAY_CIRCUIT_HALF_OPEN_PROBE_CAPACITY:-1}
      MODEL_GATEWAY_CACHE_ENABLED: ${MODEL_GATEWAY_CACHE_ENABLED:-false}
      MODEL_GATEWAY_CACHE_TTL_SECONDS: ${MODEL_GATEWAY_CACHE_TTL_SECONDS:-60.0}
      MODEL_GATEWAY_TELEMETRY_ENABLED: ${MODEL_GATEWAY_TELEMETRY_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://aaa:aaa@postgres:5432/aaa
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: aaa-minio
      MINIO_SECRET_KEY: aaa-minio-secret
      MINIO_BUCKET: aaa
      MINIO_SECURE: "false"
      HEALTHCHECK_TIMEOUT_SECONDS: "2.0"
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-20971520}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      UPLOAD_CHUNK_SIZE_BYTES: ${UPLOAD_CHUNK_SIZE_BYTES:-1048576}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-compose-only-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-aaa-v3}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-aaa-v3-api}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
      ARGON2_HASH_LENGTH: ${ARGON2_HASH_LENGTH:-32}
      ARGON2_SALT_LENGTH: ${ARGON2_SALT_LENGTH:-16}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_probe:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: aaa-v3-api
    build: *application_build
    profiles: [mock, cpu, gpu]
    command: ["uv", "run", "--no-sync", "python", "-m", "apps.worker"]
    stop_grace_period: 45s
    environment:
      APP_ENV: development
      AAA_PROFILE: ${AAA_PROFILE:-mock}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-auto}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:8080}
      MODEL_ID: ${MODEL_ID:-meta-llama/Llama-3.2-3B-Instruct}
      MODEL_ARTIFACT_PATH: ${MODEL_ARTIFACT_PATH:-models/llama-3.2-3b-instruct-q4_k_m.gguf}
      MODEL_LOCK_PATH: ${MODEL_LOCK_PATH:-models/MODELS.lock}
      LLAMA_CPP_VERSION: ${LLAMA_CPP_VERSION:-v0.6.0}
      MODEL_GATEWAY_RETRY_MAX_ATTEMPTS: ${MODEL_GATEWAY_RETRY_MAX_ATTEMPTS:-2}
      MODEL_GATEWAY_RETRY_BASE_DELAY_SECONDS: ${MODEL_GATEWAY_RETRY_BASE_DELAY_SECONDS:-0.05}
      MODEL_GATEWAY_RETRY_MAX_DELAY_SECONDS: ${MODEL_GATEWAY_RETRY_MAX_DELAY_SECONDS:-1.0}
      MODEL_GATEWAY_RETRY_JITTER_SECONDS: ${MODEL_GATEWAY_RETRY_JITTER_SECONDS:-0.05}
      MODEL_GATEWAY_INTERACTIVE_CAPACITY: ${MODEL_GATEWAY_INTERACTIVE_CAPACITY:-4}
      MODEL_GATEWAY_PREFETCH_CAPACITY: ${MODEL_GATEWAY_PREFETCH_CAPACITY:-2}
      MODEL_GATEWAY_BATCH_CAPACITY: ${MODEL_GATEWAY_BATCH_CAPACITY:-1}
      MODEL_GATEWAY_TIMEOUT_SECONDS: ${MODEL_GATEWAY_TIMEOUT_SECONDS:-30.0}
      MODEL_GATEWAY_CIRCUIT_FAILURE_THRESHOLD: ${MODEL_GATEWAY_CIRCUIT_FAILURE_THRESHOLD:-3}
      MODEL_GATEWAY_CIRCUIT_OPEN_DURATION_SECONDS: ${MODEL_GATEWAY_CIRCUIT_OPEN_DURATION_SECONDS:-30.0}
      MODEL_GATEWAY_CIRCUIT_HALF_OPEN_PROBE_CAPACITY: ${MODEL_GATEWAY_CIRCUIT_HALF_OPEN_PROBE_CAPACITY:-1}
      MODEL_GATEWAY_CACHE_ENABLED: ${MODEL_GATEWAY_CACHE_ENABLED:-false}
      MODEL_GATEWAY_CACHE_TTL_SECONDS: ${MODEL_GATEWAY_CACHE_TTL_SECONDS:-60.0}
      MODEL_GATEWAY_TELEMETRY_ENABLED: ${MODEL_GATEWAY_TELEMETRY_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://aaa:aaa@postgres:5432/aaa
      REDIS_URL: redis://redis:6379/0
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-15}
      WORKER_REAPER_SECONDS: ${WORKER_REAPER_SECONDS:-15}
      WORKER_RETRY_BASE_SECONDS: ${WORKER_RETRY_BASE_SECONDS:-2}
      WORKER_RETRY_MAX_SECONDS: ${WORKER_RETRY_MAX_SECONDS:-300}
      WORKER_SHUTDOWN_GRACE_SECONDS: ${WORKER_SHUTDOWN_GRACE_SECONDS:-30}
      WORKER_IO_TIMEOUT_SECONDS: ${WORKER_IO_TIMEOUT_SECONDS:-5}
      WORKER_LANES: ${WORKER_LANES:-["interactive","prefetch","batch"]}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: aaa-minio
      MINIO_SECRET_KEY: aaa-minio-secret
      MINIO_BUCKET: aaa
      MINIO_SECURE: "false"
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-20971520}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      EXTRACTION_TIMEOUT_SECONDS: ${EXTRACTION_TIMEOUT_SECONDS:-60}
      EXTRACTION_MAX_OUTPUT_BYTES: ${EXTRACTION_MAX_OUTPUT_BYTES:-4194304}
      EXTRACTION_MEMORY_MB: ${EXTRACTION_MEMORY_MB:-512}
      EXTRACTION_MINIMUM_USEFUL_CHARACTERS: ${EXTRACTION_MINIMUM_USEFUL_CHARACTERS:-40}
      DRAFT_TIMEOUT_SECONDS: ${DRAFT_TIMEOUT_SECONDS:-30}
      DRAFT_ARTIFACT_MAX_BYTES: ${DRAFT_ARTIFACT_MAX_BYTES:-4194304}
      DRAFT_MAX_SECTIONS: ${DRAFT_MAX_SECTIONS:-128}
      DRAFT_UNIT_OUTPUT_MAX_BYTES: ${DRAFT_UNIT_OUTPUT_MAX_BYTES:-65536}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_probe:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
