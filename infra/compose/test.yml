# Standalone test stack: never merge with the persistent development stack.
services:
  # Opt-in process smoke tests; ordinary pytest starts only dependency services.
  worker:
    extends:
      file: ../../docker-compose.yml
      service: worker
    profiles: [worker]
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://aaa_test:aaa_test@postgres:5432/aaa_test
      REDIS_URL: redis://redis:6379/0
      MINIO_ACCESS_KEY: aaa-test-minio
      MINIO_SECRET_KEY: aaa-test-minio-secret
      MINIO_BUCKET: aaa-test

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aaa_test
      POSTGRES_USER: aaa_test
      POSTGRES_PASSWORD: aaa_test
    ports: ["127.0.0.1::5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaa_test -d aaa_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["127.0.0.1::6379"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z@sha256:8793e960474071520bdb91bb9a6d1793eb229fdbc9dcb7ec75ad836b69bbab40
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: aaa-test-minio
      MINIO_ROOT_PASSWORD: aaa-test-minio-secret
    ports: ["127.0.0.1::9000"]
    tmpfs: [/data]

  minio_probe:
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    entrypoint: ["/bin/sleep"]
    command: ["infinity"]
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://minio:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
