[project]
name = "aaa-v3"
version = "0.1.0"
description = "AAA v3 runtime foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.15.2",
    "asyncpg==0.30.0",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "minio==7.2.15",
    "pydantic==2.13.5",
    "pydantic-settings==2.9.1",
    "redis==5.2.1",
    "sqlalchemy==2.0.40",
    "structlog==25.2.0",
    "uvicorn==0.34.2",
]

[dependency-groups]
dev = [
    "import-linter==2.15.0",
    "mypy==1.20.2",
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "ruff==0.16.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["__agent__", ".venv", "build", "dist", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
